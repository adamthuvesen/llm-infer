name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.13.5"
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"

      - name: Install dev dependencies
        run: uv sync --locked --extra dev --extra serving

      - name: Install visualizer dependencies
        run: npm ci --prefix visualizer

      - name: Run CPU verification checks
        run: make check

  verify:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --locked --extra dev --extra serving

      - name: Drive the real server, loadgen, and Modal launch paths
        run: |
          make verify ARGS=all
          make verify ARGS=control
