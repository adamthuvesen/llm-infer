[project]
name = "llm-infer"
version = "0.1.0"
description = "A small paged LLM inference engine with pluggable model backends."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.2",
    "transformers>=4.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "modal==1.5.0",
    "mypy>=1.19",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
gpu = [
    "flashinfer-python==0.6.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_infer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["llm_infer"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "^llm_infer/benchmarks/",
    "^llm_infer/kernels/(flash_attn_paged|flashinfer_graph|flashinfer_paged)\\.py$",
    "^llm_infer/model/grouped_decode_graph\\.py$",
    "^llm_infer/serving/engine_(decode|prefill|preemption|trace)\\.py$",
    "^llm_infer/serving/server/(app|async_engine|streaming)\\.py$",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: loads the 3B model and runs a forward pass (CPU-runnable but heavy)",
]
