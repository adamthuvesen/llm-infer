[project]
name = "llm-infer"
version = "0.1.0"
description = "A small paged LLM inference engine with pluggable model backends."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    # Pinned to the Modal GPU image's torch (scripts/modal_flash_image.py), so CPU tests
    # and GPU benchmarks run one stack. flash-attn 2.x ships wheels only up to torch 2.8.
    "torch==2.8.0",
    "transformers>=4.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "modal==1.5.0",
    "mypy>=1.19",
    "import-linter>=2.15",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
gpu = [
    "flashinfer-python==0.6.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_infer"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["llm_infer", "scripts/check_benchmark_evidence.py", "scripts/judge_paired_ab.py"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.importlinter]
root_package = "llm_infer"

[[tool.importlinter.contracts]]
name = "Policy readers use reference_policy.EsmeAgreement without execution imports"
type = "forbidden"
source_modules = [
    "llm_infer.benchmarks.reference_policy",
    "llm_infer.benchmarks.paired_ab",
]
forbidden_modules = [
    "llm_infer.model",
    "llm_infer.serving",
    "llm_infer.scheduler",
    "llm_infer.kv_cache",
    "llm_infer.kernels",
    "llm_infer.benchmarks.esme_paged",
    "llm_infer.benchmarks.esme_three_way",
    "llm_infer.benchmarks.esme_gallery",
]

[[tool.importlinter.contracts]]
name = "KV cache and kernels do not depend on models, scheduling, serving, or benchmarks"
type = "forbidden"
source_modules = ["llm_infer.kv_cache", "llm_infer.kernels"]
forbidden_modules = [
    "llm_infer.model",
    "llm_infer.scheduler",
    "llm_infer.serving",
    "llm_infer.benchmarks",
]

[[tool.importlinter.contracts]]
name = "Models do not depend on scheduling, serving, or benchmarks"
type = "forbidden"
source_modules = ["llm_infer.model"]
forbidden_modules = ["llm_infer.scheduler", "llm_infer.serving", "llm_infer.benchmarks"]

[[tool.importlinter.contracts]]
name = "Scheduler uses request values without engine, HTTP, model, or benchmark imports"
type = "forbidden"
source_modules = ["llm_infer.scheduler"]
forbidden_modules = [
    "llm_infer.serving.engine",
    "llm_infer.serving.server",
    "llm_infer.model",
    "llm_infer.benchmarks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: loads the 3B model and runs a forward pass (CPU-runnable but heavy)",
]
