<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>llm-infer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C1F28'/%3E%3Cpath d='M5 10h8M4 16h10M5 22h8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='m20 7 8 9-8 9-6-9 6-9Z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='20.5' cy='16' r='1.7' fill='white'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Letterpress: crisp white paper, blue-black ink, one deep oxblood signal. */
    --paper: #FAFAF9;
    --surface: #FFFFFF;
    --ink: #1A1C21;
    --muted: #5C5F66;
    --faint: #898B90;
    --line: #E6E5E2;
    --line-strong: #D3D2CD;
    --hover: #EFEEEB;
    --user-wash: #EDECE8;
    --accent: #7C1F28;
    --accent-strong: #5B121A;
    --accent-soft: #F6EBEA;
    --accent-wash-a: rgba(124, 31, 40, .06);
    --accent-wash-b: rgba(124, 31, 40, .15);
    --danger: #B3372B;

    --display: "Newsreader", Georgia, serif;
    --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --rail: 248px;
    --measure: 720px;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .app { display: grid; grid-template-columns: var(--rail) 1fr; height: 100dvh; }
  .app.rail-collapsed { grid-template-columns: 0 1fr; }

  /* ---------- Sidebar ---------- */
  .rail {
    grid-column: 1; grid-row: 1;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 14px 12px; gap: 4px;
    overflow: hidden; min-width: 0;
    background: var(--paper);
  }
  .rail-collapsed .rail { visibility: hidden; padding-inline: 0; border-right: 0; }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 14px; }
  .brand .mark { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transition: box-shadow .2s; }
  .brand .dot.live { box-shadow: 0 0 0 4px var(--accent-soft); }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center;
    color: var(--muted); transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn svg { width: 17px; height: 17px; }

  .new-chat {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border-radius: 7px; font-weight: 500; font-size: 14px;
    transition: background .12s;
  }
  .new-chat:hover { background: var(--hover); }
  .new-chat svg { width: 16px; height: 16px; color: var(--muted); }

  .history { margin-top: 14px; overflow-y: auto; flex: 1; }
  .history-toggle {
    width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 10px 5px;
    border-radius: 5px; color: var(--faint); font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase; text-align: left;
    transition: background .12s, color .12s;
  }
  .history-toggle:hover { background: var(--hover); color: var(--ink); }
  .history-toggle svg { width: 12px; height: 12px; transition: transform .16s ease; }
  .history-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .history-list { display: flex; flex-direction: column; gap: 1px; }
  .history-list[hidden] { display: none; }
  .chat-item {
    display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px;
    font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .12s, color .12s;
  }
  .chat-item:hover { background: var(--hover); color: var(--ink); }
  .chat-item.active { background: var(--hover); color: var(--ink); font-weight: 500; }

  .rail-foot { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
  .model-chip {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 7px;
    transition: background .12s;
  }
  .model-chip:hover { background: var(--hover); }
  .model-chip .glyph { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--surface);
    display: grid; place-items: center; flex: none; }
  .model-chip .glyph svg, .avatar svg { width: 17px; height: 17px; display: block; }
  .model-chip .meta { min-width: 0; text-align: left; }
  .model-chip .name { font-family: var(--mono); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-chip .sub { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  /* ---------- Main ---------- */
  .main { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 18px 0 14px; flex: none; }
  .app:not(.rail-collapsed) #rail-open { display: none; }
  .app.rail-open #rail-open { display: none; }
  .topbar .spacer { flex: 1; }

  /* The instrument: live decode-rate trace + session odometer, fed by the real stream. */
  .meter {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--surface); user-select: none;
  }
  .meter svg { display: block; width: 84px; height: 20px; overflow: visible; }
  .meter .trace { fill: none; stroke: var(--line-strong); stroke-width: 1.5; transition: stroke .3s; }
  .meter.live .trace { stroke: var(--accent); }
  .meter .rate { min-width: 74px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter.live .rate { color: var(--accent-strong); }
  .meter .sep { width: 1px; height: 14px; background: var(--line); }
  .meter .odo { color: var(--faint); font-variant-numeric: tabular-nums; }

  .scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid var(--paper); }

  /* ---------- Empty / hero state ---------- */
  .hero {
    min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 30px 24px 8vh;
  }
  .hero-inner { width: 100%; max-width: var(--measure); }
  .hero-copy { margin-bottom: 22px; }
  .hero-kicker {
    display: flex; align-items: center; gap: 9px; margin-bottom: 14px;
    color: var(--muted); font-family: var(--mono); font-size: 11px;
    letter-spacing: .07em; text-transform: uppercase;
  }
  .hero-kicker .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 4px var(--accent-wash-a); } }
  .hero h1 {
    margin: 0; max-width: 640px;
    font-family: var(--display); font-optical-sizing: auto;
    font-size: clamp(32px, 4.2vw, 46px);
    line-height: 1.04; letter-spacing: -.015em; font-weight: 500;
  }
  .hero h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
  .hero-copy p { margin: 12px 0 0; max-width: 560px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }

  /* Data plate: the model's real architecture, engraved. */
  .plate {
    display: flex; align-items: stretch;
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
    margin-bottom: 26px; overflow-x: auto;
  }
  .plate-cell { flex: 1; min-width: 0; padding: 10px 14px 11px; white-space: nowrap; }
  .plate-cell + .plate-cell { border-left: 1px solid var(--line); }
  .plate-cell .k {
    display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 2px;
  }
  .plate-cell .v { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }

  .starter { margin-bottom: 18px; }
  .starter-head {
    display: flex; align-items: center; gap: 14px; padding: 0 2px 10px;
  }
  .starter-title {
    font-family: var(--mono); font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--faint); white-space: nowrap;
  }
  .starter-head .spacer { flex: 1; }
  .topic-select-wrap { position: relative; display: flex; align-items: center; }
  .topic-select {
    appearance: none; min-width: 160px; border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface); color: var(--ink); padding: 6px 30px 6px 10px;
    font: 500 12px/1.2 var(--font); cursor: pointer;
  }
  .topic-select-wrap svg { position: absolute; right: 9px; width: 13px; height: 13px; pointer-events: none; color: var(--muted); }
  .starter-questions { display: flex; flex-direction: column; }
  .starter-question {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px; padding: 10px 2px; border-top: 1px solid var(--line);
    text-align: left; color: var(--muted); font-size: 14px; line-height: 1.35;
    transition: color .12s;
  }
  .starter-question:last-child { border-bottom: 1px solid var(--line); }
  .starter-question svg { width: 15px; height: 15px; flex: none; opacity: 0; transform: translateX(-4px); transition: opacity .14s, transform .14s; color: var(--accent); }
  .starter-question:hover { color: var(--accent-strong); }
  .starter-question:hover svg { opacity: 1; transform: translateX(0); }
  .starter-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 9px 2px 0; color: var(--faint); font-size: 11.5px;
  }
  .more-questions { color: var(--accent-strong); font-size: 11.5px; font-weight: 500; padding: 4px 0; }
  .more-questions:hover { text-decoration: underline; text-underline-offset: 3px; }
  .hero .composer-wrap { width: 100%; }

  /* Gentle rise on first paint. */
  .hero-copy, .plate, .starter, .hero .composer-wrap { animation: rise .45s cubic-bezier(.2,.7,.3,1) both; }
  .plate { animation-delay: .05s; }
  .starter { animation-delay: .1s; }
  .hero .composer-wrap { animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- Thread ---------- */
  .thread { max-width: var(--measure); margin: 0 auto; padding: 18px 24px 8px; display: flex; flex-direction: column; gap: 26px; }
  .turn { display: flex; flex-direction: column; }
  .turn.user { align-items: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 15px; border-radius: 9px 9px 3px 9px;
    background: var(--user-wash); white-space: pre-wrap; word-wrap: break-word;
  }
  .turn.assistant { align-items: stretch; }
  .answer { display: flex; gap: 14px; }
  .avatar {
    width: 27px; height: 27px; border-radius: 6px; flex: none; margin-top: 2px;
    background: var(--accent); color: var(--surface); display: grid; place-items: center;
  }
  .avatar.live svg { animation: stream-mark .8s ease-in-out infinite; }
  @keyframes stream-mark { 50% { transform: translateX(1px); opacity: .76; } }
  .prose { min-width: 0; flex: 1; }
  .prose > *:first-child { margin-top: 0; }
  .prose > *:last-child { margin-bottom: 0; }
  .prose p { margin: 0 0 12px; }
  .prose pre { background: #14161C; color: #E8EAF0; border-radius: 7px; padding: 14px 16px; overflow-x: auto;
    font-family: var(--mono); font-size: 13px; line-height: 1.55; margin: 0 0 12px; }
  .prose code { font-family: var(--mono); font-size: 0.88em; background: var(--hover); padding: 1px 5px; border-radius: 5px; }
  .prose pre code { background: none; padding: 0; font-size: 13px; }
  .prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; }
  .prose strong { font-weight: 600; }
  .prose .err { color: var(--danger); }
  .tokcaret {
    display: inline-block; width: 7px; height: 1.05em; margin-left: 1px; vertical-align: text-bottom;
    background: var(--accent); border-radius: 1.5px; animation: caret-blink 1s steps(2) infinite;
  }
  @keyframes caret-blink { 50% { opacity: 0; } }

  /* Token inspector: the answer split into the exact chunks the engine emitted. */
  .tokview { white-space: pre-wrap; word-wrap: break-word; line-height: 1.75; }
  .tokview span { border-radius: 3px; padding: 1px 0; }
  .tokview span:nth-child(odd) { background: var(--accent-wash-a); }
  .tokview span:nth-child(even) { background: var(--accent-wash-b); }

  /* Per-answer readout, engraved under the prose. */
  .telemetry { margin-top: 9px; padding-left: 41px; font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    display: flex; align-items: center; flex-wrap: wrap; gap: 0; opacity: 0; transition: opacity .3s;
    font-variant-numeric: tabular-nums; }
  .telemetry.show { opacity: 1; }
  .telemetry .sep { margin: 0 9px; color: var(--line-strong); }
  .tok-toggle {
    font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line-strong);
    transition: color .12s, border-color .12s, background .12s;
  }
  .tok-toggle:hover { color: var(--accent-strong); border-color: var(--accent); }
  .tok-toggle[aria-pressed="true"] { color: var(--accent-strong); background: var(--accent-soft); border-color: var(--accent); }

  /* ---------- Composer ---------- */
  .composer-dock { flex: none; padding: 8px 24px 20px; }
  .composer {
    max-width: var(--measure); margin: 0 auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(23,26,33,.03), 0 8px 24px -16px rgba(23,26,33,.12);
    transition: border-color .14s, box-shadow .14s;
  }
  .composer.focused { border-color: #C9A5A5; box-shadow: 0 0 0 3px var(--accent-wash-a), 0 10px 30px -16px rgba(26,28,33,.16); }
  .composer textarea {
    display: block; width: 100%; border: none; outline: none; resize: none; background: none;
    padding: 15px 18px 4px; font-size: 15.5px; line-height: 1.55; color: var(--ink);
    max-height: 240px; overflow-y: auto;
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 12px; }
  .params-btn {
    display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 6px;
    font-family: var(--mono); font-size: 12px; color: var(--muted); transition: background .12s, color .12s;
  }
  .params-btn:hover { background: var(--hover); color: var(--ink); }
  .params-btn svg { width: 13px; height: 13px; }
  .quick-question {
    position: relative; display: flex; align-items: center; min-width: 0; color: var(--muted);
    border-radius: 6px; transition: background .12s, color .12s;
  }
  .quick-question:hover { background: var(--hover); color: var(--ink); }
  .quick-question:has(select:disabled) { opacity: .52; pointer-events: none; }
  .quick-question .idea-icon { position: absolute; left: 8px; width: 14px; height: 14px; pointer-events: none; }
  .quick-question .chevron { position: absolute; right: 7px; width: 12px; height: 12px; pointer-events: none; }
  .quick-question select {
    appearance: none; width: 142px; min-width: 0; border: 0; outline: 0; background: transparent;
    color: inherit; padding: 6px 24px 6px 27px; font: 500 12.5px/1.2 var(--font); cursor: pointer;
  }
  .composer-row .spacer { flex: 1; }
  .send {
    width: 34px; height: 34px; border-radius: 7px; flex: none;
    display: grid; place-items: center; background: var(--ink); color: var(--surface);
    transition: opacity .14s, transform .1s, background .14s;
  }
  .send svg { width: 17px; height: 17px; }
  .send:disabled { background: var(--line-strong); color: var(--surface); cursor: not-allowed; }
  .send:not(:disabled) { background: var(--accent); }
  .send:not(:disabled):hover { background: var(--accent-strong); }
  .send:not(:disabled):active { transform: scale(.92); }
  .send.stop { background: var(--accent-strong); }
  .send.stop svg { width: 13px; height: 13px; }

  /* ---------- Params popover ---------- */
  .popover-backdrop { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(23,26,33,.32); }
  .popover-backdrop.open { display: block; }
  .popover {
    position: fixed; z-index: 41; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 380px; max-width: calc(100vw - 32px);
    max-height: calc(100dvh - 32px); overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 24px 64px -20px rgba(23,26,33,.35); padding: 22px 22px 24px; display: none;
  }
  .popover.open { display: block; }
  .pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .pop-title { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .pop-close { width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); transition: background .12s, color .12s; }
  .pop-close:hover { background: var(--hover); color: var(--ink); }
  .pop-close svg { width: 14px; height: 14px; }
  .field { margin-bottom: 22px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 450; margin-bottom: 11px; }
  .field .val { font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--hover); padding: 2px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .field input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 3px; background: var(--line-strong); outline: none; cursor: pointer; }
  .field input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: pointer; }
  .field input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); cursor: pointer; }
  .field textarea {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; padding: 9px 11px;
    font-family: inherit; font-size: 13px; line-height: 1.5; outline: none; resize: vertical; color: var(--ink);
  }
  .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash-a); }
  .field .help { font-size: 11.5px; color: var(--faint); margin-top: 8px; line-height: 1.5; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Throughput bench ---------- */
  .bench-toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); }
  .bench-label { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }

  .bench { max-width: 1180px; margin: 0 auto; padding: 20px 24px 64px; }
  .bench-head { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; margin-bottom: 16px; }
  .bench-readout {
    flex: 1 1 300px; min-width: 250px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
    padding: 13px 18px 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  }
  .bench-readout .k { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .bench-tps { display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .bench-tps .num { font-size: 38px; font-weight: 500; line-height: 1; color: var(--ink); transition: color .3s; }
  .bench.live .bench-tps .num { color: var(--accent-strong); }
  .bench-tps .unit { font-size: 14px; color: var(--faint); }
  .bench-trace { width: 100%; height: 46px; display: block; overflow: visible; }
  .bench-trace .trace { fill: none; stroke: var(--line-strong); stroke-width: 1.5; transition: stroke .3s; }
  .bench.live .bench-trace .trace { stroke: var(--accent); }
  .bench-plate { flex: 2 1 400px; margin-bottom: 0; align-items: stretch; }
  .bench-plate .plate-cell { display: flex; flex-direction: column; justify-content: center; }

  .bench-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .bench-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 8px;
    font: 500 13px/1 var(--font); transition: background .14s, border-color .14s, color .14s, opacity .14s;
  }
  .bench-btn.primary { background: var(--accent); color: var(--surface); }
  .bench-btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
  .bench-btn.secondary { border: 1px solid var(--line-strong); color: var(--ink); background: var(--surface); }
  .bench-btn.secondary:hover:not(:disabled) { background: var(--hover); }
  .bench-btn.ghost { border: 1px solid var(--line-strong); color: var(--muted); background: var(--surface); }
  .bench-btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .bench-btn:disabled { opacity: .48; cursor: not-allowed; }
  /* Stream-count segmented control: the selected side reads engraved, like tok-toggle. */
  .bench-count { display: flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; background: var(--surface); }
  .bench-count button {
    padding: 7px 11px; font-family: var(--mono); font-size: 12px; color: var(--muted);
    transition: background .12s, color .12s;
  }
  .bench-count button + button { border-left: 1px solid var(--line-strong); }
  .bench-count button:hover { background: var(--hover); color: var(--ink); }
  .bench-count button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; }
  .bench-base {
    appearance: none; min-width: 180px; flex: 0 1 230px;
    border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink);
    padding: 8px 11px; font: 500 12px/1.2 var(--mono);
  }
  .bench-base::placeholder { color: var(--faint); }
  .bench-base:disabled { opacity: .6; }
  .bench-reshuffle { font-family: var(--mono); font-size: 11.5px; color: var(--accent-strong); padding: 4px 6px; }
  .bench-reshuffle:hover:not(:disabled) { text-decoration: underline; text-underline-offset: 3px; }
  .bench-reshuffle:disabled { opacity: .48; cursor: not-allowed; }
  .bench-guide { color: var(--faint); font-size: 12px; font-family: var(--mono); margin: 0 0 16px; }

  .bench-races { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .bench-races:empty { display: none; }
  .race-row { display: flex; align-items: center; gap: 12px; }
  .race-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 92px; flex: none; }
  .race-track { flex: 1; height: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .race-fill { display: block; height: 100%; width: 0; transition: width .7s cubic-bezier(.2,.7,.3,1); }
  /* The in-flight row tracks the 200ms bench tick; a short linear ease just smooths steps. */
  .race-fill.live { transition: width .25s linear; }
  .race-fill.sequential { background: var(--user-wash); }
  .race-fill.concurrent { background: var(--accent); }
  .race-time { font-family: var(--mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; width: 60px; text-align: right; flex: none; }
  .race-punch { font-family: var(--mono); font-size: 12.5px; color: var(--accent-strong); padding-left: 104px; }

  .bench-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .pane { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 180px; display: flex; flex-direction: column; overflow: hidden; }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 9px 11px 7px; }
  .pane-idx { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--faint); }
  .pane-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
  .pane.streaming .pane-dot { background: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
  .pane.done .pane-dot { display: none; }
  .pane.error .pane-dot { background: var(--danger); }
  .pane.stopped .pane-dot { background: var(--faint); }
  /* Completion check: replaces the status dot when the request finishes, engraved at the
     head's right edge so a glance down the grid reads which of the eight are done. */
  .pane-check { display: none; margin-left: auto; width: 14px; height: 14px; color: var(--accent-strong); flex: none; }
  .pane.done .pane-check { display: block; animation: check-in .25s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes check-in { from { opacity: 0; transform: scale(.6); } }
  .pane-q { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 11px 8px; border-bottom: 1px solid var(--line); }
  .pane-body {
    flex: 1; overflow: hidden; padding: 9px 11px 0; font-size: 12.5px; line-height: 1.5; color: var(--ink);
    white-space: pre-wrap; word-wrap: break-word;
    -webkit-mask-image: linear-gradient(to bottom, #000 74%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 74%, transparent 100%);
  }
  .pane-body.err { color: var(--danger); font-family: var(--mono); font-size: 11.5px; }
  .pane-foot { padding: 6px 11px 8px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

  @media (max-width: 1100px) { .bench-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) {
    .bench { padding: 16px 14px 48px; }
    .bench-grid { grid-template-columns: 1fr; }
    .race-punch { padding-left: 0; }
  }

  .rail-scrim { display: none; }

  @media (max-width: 820px) {
    /* Rail becomes a fixed overlay, so the grid is a single column the main fills. */
    .app, .app.rail-collapsed, .app.rail-open { grid-template-columns: 1fr; }
    .app.rail-open .rail-scrim { display: block; position: fixed; inset: 0; z-index: 49; background: rgba(26,28,33,.32); border: 0; padding: 0; }
    .rail { grid-column: 1; grid-row: 1; position: fixed; z-index: 50; width: var(--rail); height: 100dvh; box-shadow: 0 0 40px rgba(0,0,0,.12); transform: translateX(-100%); transition: transform .2s; display: flex; }
    .main { grid-column: 1; grid-row: 1; }
    .app.rail-open .rail { visibility: visible; padding: 14px 12px; border-right: 1px solid var(--line); transform: translateX(0); }
    .bubble { max-width: 88%; }
    .meter .odo, .meter .sep { display: none; }
  }

  @media (max-width: 620px) {
    .hero { justify-content: flex-start; padding: 40px 14px 32px; }
    .hero-copy { margin-bottom: 20px; }
    .hero h1 { font-size: 30px; }
    .plate { flex-wrap: wrap; overflow: hidden; }
    .plate-cell { flex: 1 1 33%; border-top: 1px solid var(--line); }
    .plate-cell:nth-child(-n+3) { border-top: 0; }
    .plate-cell:nth-child(4) { border-left: 0; }
    .starter-head { align-items: flex-start; flex-wrap: wrap; gap: 8px; }
    .starter-head .spacer { display: none; }
    .topic-select-wrap, .topic-select { width: 100%; }
    .starter-foot span { display: none; }
    .starter-foot { justify-content: flex-end; }
    .quick-question select { width: 140px; }
    .params-btn #params-label { display: none; }
    .composer-dock { padding-inline: 14px; }
    .thread { padding-inline: 14px; }
    .meter svg { width: 56px; }
    .meter .rate { min-width: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app rail-collapsed" id="app">
  <!-- Sidebar -->
  <aside class="rail" id="sidebar">
    <div class="brand">
      <div class="mark"><span class="dot" id="brand-dot"></span> llm-infer</div>
      <button class="icon-btn" id="rail-toggle" title="Close sidebar" aria-label="Close sidebar" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>
    <button class="new-chat" id="new-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="history" id="history">
      <div class="history-label">Recent</div>
    </div>
    <div class="rail-foot">
      <button class="model-chip" id="model-foot" title="Sampling parameters">
        <span class="glyph" id="model-glyph" aria-hidden="true"></span>
        <span class="meta">
          <span class="name" id="model-name">connecting…</span>
          <span class="sub">local · greedy by default</span>
        </span>
      </button>
    </div>
  </aside>

  <button class="rail-scrim" id="rail-scrim" aria-label="Close sidebar" tabindex="-1"></button>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="rail-open" title="Open sidebar" aria-label="Open sidebar" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <span class="spacer"></span>
      <span class="bench-label" aria-hidden="true">bench</span>
      <button class="icon-btn bench-toggle" id="bench-toggle" title="Throughput bench" aria-pressed="false" aria-label="Throughput bench">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      </button>
      <div class="meter" id="meter" title="Live decode rate and session tokens" aria-label="Engine meter">
        <svg viewBox="0 0 84 20" aria-hidden="true"><polyline class="trace" id="meter-trace" points="0,19 84,19" /></svg>
        <span class="rate" id="meter-rate">— tok/s</span>
        <span class="sep" aria-hidden="true"></span>
        <span class="odo" id="meter-odo">Σ 0 tok</span>
      </div>
    </div>

    <div class="scroll" id="scroll">
      <!-- hero or thread injected here -->
    </div>

    <!-- Composer template lives once; moved between hero and dock -->
    <div class="composer-dock" id="dock" hidden>
      <div class="composer-wrap" id="dock-slot"></div>
    </div>
  </main>
</div>

<!-- Composer (single instance, relocated between hero & dock) -->
<template id="composer-tpl">
  <div class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Message the model…" autofocus></textarea>
    <div class="composer-row">
      <button class="params-btn" id="params-btn" aria-haspopup="true" aria-label="Sampling parameters" title="Sampling parameters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        <span id="params-label">temp 0.00 · p 1.00 · k 0</span>
      </button>
      <label class="quick-question" title="Choose and send a sample question">
        <span class="sr-only">Sample questions</span>
        <svg class="idea-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 18h6M10 22h4M8.5 14.5A7 7 0 1 1 15.5 14.5C14.5 15.3 14 16 14 18h-4c0-2-.5-2.7-1.5-3.5Z"/></svg>
        <select id="quick-question" aria-label="Sample questions" autocomplete="off">
          <option value="">Question ideas</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
      </label>
      <div class="popover-backdrop" id="pop-backdrop"></div>
      <div class="popover" id="popover" role="dialog" aria-label="Sampling parameters">
        <div class="pop-head">
          <div class="pop-title">Sampling</div>
          <button class="pop-close" id="pop-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="field">
          <label>Temperature <span class="val" id="temp-val">0.00</span></label>
          <input type="range" id="temp" min="0" max="2" step="0.05" value="0" />
          <div class="help">0 is the proven greedy reference check — deterministic, token-for-token.</div>
        </div>
        <div class="field">
          <label>Top-p <span class="val" id="top-p-val">1.00</span></label>
          <input type="range" id="top-p" min="0.05" max="1" step="0.05" value="1" />
        </div>
        <div class="field">
          <label>Top-k <span class="val" id="top-k-val">0</span></label>
          <input type="range" id="top-k" min="0" max="100" step="1" value="0" />
          <div class="help">0 keeps the full vocabulary.</div>
        </div>
        <div class="field">
          <label>Frequency penalty <span class="val" id="freq-val">0.00</span></label>
          <input type="range" id="freq" min="-2" max="2" step="0.05" value="0" />
        </div>
        <div class="field">
          <label>Presence penalty <span class="val" id="presence-val">0.00</span></label>
          <input type="range" id="presence" min="-2" max="2" step="0.05" value="0" />
        </div>
        <div class="field">
          <label>Max new tokens <span class="val" id="max-val">128</span></label>
          <input type="range" id="maxtok" min="16" max="2048" step="16" value="128" />
        </div>
        <div class="field">
          <label for="system">System prompt</label>
          <textarea id="system" rows="2" placeholder="Optional — sets the assistant's behavior."></textarea>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="send" id="send" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="send-icon"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</template>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const DEFAULT_PARAMS = {
    temperature: 0,
    topP: 1,
    topK: 0,
    frequencyPenalty: 0,
    presencePenalty: 0,
    maxTokens: 128,
    system: "Always write short, direct responses.",
  };
  const ESME_MARK = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 7h6M3 12h7.5M3.5 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.2 5.2 21 12l-5.8 6.8L11 12l4.2-6.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15.6" cy="12" r="1.35" fill="currentColor"/></svg>`;
  // Real architecture from the bundle's config.json — an engraved data plate, not marketing copy.
  const SPEC_PLATE = [
    ["params", "214 M"],
    ["layers", "30"],
    ["width", "768"],
    ["attention", "GQA 12/4"],
    ["context", "1 024"],
    ["vocab", "32 768"],
  ];
  const STARTER_TOPICS = {
    "Science": [
      "Why do Earth's seasons occur?",
      "How does photosynthesis work?",
      "What does DNA do?",
      "Why does ice float on water?",
      "What is an electric circuit?",
      "Why can sound not travel through empty space?",
      "What causes a solar eclipse?",
      "How do magnets work?",
    ],
    "Body & health": [
      "What do the kidneys do?",
      "What is the difference between bacteria and viruses?",
      "Why does the body need iron?",
      "What does the immune system do?",
      "Why do humans need sleep?",
      "What is the purpose of digestion?",
      "How do the lungs exchange oxygen and carbon dioxide?",
      "What is a cell?",
    ],
    "Nature & climate": [
      "Why are coral reefs important?",
      "How do greenhouse gases warm the atmosphere?",
      "What is an ecosystem?",
      "What is the difference between weather and climate?",
      "How does deforestation affect the environment?",
      "What is biodiversity?",
      "What causes ocean tides?",
      "How does the water cycle work?",
    ],
    "History & politics": [
      "What caused the French Revolution?",
      "What was the Roman Republic?",
      "What were the main causes of World War I?",
      "Why was the Industrial Revolution important?",
      "What was the Cold War?",
      "How does a parliamentary system work?",
      "What was the Silk Road?",
      "How did the printing press change Europe?",
    ],
    "Geography & civics": [
      "What is the capital of Kenya?",
      "Where are the Andes Mountains?",
      "Which countries border Germany?",
      "What is the difference between Great Britain and the United Kingdom?",
      "What is the purpose of a constitution?",
      "What does a central bank do?",
      "What does the World Health Organization do?",
      "What is the role of a president?",
    ],
    "Math & language": [
      "Explain the Pythagorean theorem.",
      "What is a prime number?",
      "How do you calculate the area of a circle?",
      "What is the difference between mean, median, and mode?",
      "Why can you not divide by zero?",
      "What is a metaphor?",
      "What is the difference between a fact and an opinion?",
      "Explain supply and demand.",
    ],
    "Computing": [
      "What is an HTTP request?",
      "How does binary search work?",
      "What is a Python dictionary?",
      "What happens when you enter a URL in a browser?",
      "What is the difference between RAM and storage?",
      "What does an operating system do?",
      "What is a database?",
      "What is the difference between encryption and hashing?",
    ],
    "Everyday ideas": [
      "Why does bread rise?",
      "How does a refrigerator work?",
      "Why do metals rust?",
      "What are the main ideas of Buddhism?",
      "What is utilitarianism?",
      "What is inflation?",
      "How does a semiconductor work?",
      "Why does recycling aluminum save energy?",
    ],
  };

  const $ = (id) => document.getElementById(id);
  const app = $("app"), scroll = $("scroll"), dock = $("dock");

  const state = {
    modelId: null,
    chats: load(),          // [{id, title, messages:[{role,content,stats,chunks}]}]
    activeId: null,
    abort: null,
    streaming: false,
    params: { ...DEFAULT_PARAMS },
    starterTopic: Object.keys(STARTER_TOPICS)[0],
    starterOffset: 0,
    starterSendPending: false,
    historyExpanded: true,
    meterTimes: [],         // token arrival times for the current stream
    meterTotal: 0,          // session odometer
    benchView: false,       // throughput bench mode showing instead of chat
    bench: {
      running: false, mode: null, offset: 0,
      count: (() => { try { return localStorage.getItem("llm-infer-bench-count") === "16" ? 16 : 8; } catch { return 8; } })(),
      baseUrl: (() => { try { return localStorage.getItem("llm-infer-bench-base") || ""; } catch { return ""; } })(),
      times: [],            // aggregate token arrival times across all 8 streams
      totalTokens: 0, reqsDone: 0, activeCount: 0,
      controllers: [], stopped: false, runStart: 0,
      paneProgress: new Array(8).fill(0),  // per-request completion fraction for the live bar
      results: { sequential: null, concurrent: null },  // wall seconds per mode
    },
  };

  // ---------- persistence ----------
  function load() { try { return JSON.parse(localStorage.getItem("llm-infer-chats") || "[]"); } catch { return []; } }
  function persist() { try { localStorage.setItem("llm-infer-chats", JSON.stringify(state.chats.slice(0, 40))); } catch {} }
  function activeChat() { return state.chats.find((c) => c.id === state.activeId) || null; }

  // ---------- model discovery ----------
  async function discoverModel() {
    try {
      const r = await fetch("v1/models");
      const j = await r.json();
      const id = j?.data?.[0]?.id;
      if (id) {
        state.modelId = id;
        $("model-name").textContent = id;
        const heroModel = $("hero-model");
        if (heroModel) heroModel.textContent = `${id} · serving locally`;
        if (state.starterSendPending) {
          state.starterSendPending = false;
          void send();
        }
      }
    } catch {
      $("model-name").textContent = "offline";
      toast("Couldn't reach the server. Is llm-infer.serve running?");
    }
  }

  // ---------- markdown (tiny, dependency-free) ----------
  function esc(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function renderMarkdown(text) {
    const blocks = text.split(/(```[\s\S]*?```)/g);
    return blocks.map((b) => {
      const fence = b.match(/^```(\w*)\n?([\s\S]*?)```$/);
      if (fence) return `<pre><code>${esc(fence[2].replace(/\n$/, ""))}</code></pre>`;
      let h = esc(b)
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      return h.split(/\n{2,}/).map((p) => p.trim() ? `<p>${p.replace(/\n/g, "<br>")}</p>` : "").join("");
    }).join("");
  }

  // ---------- engine meter ----------
  const METER_WINDOW_MS = 8000, METER_BUCKET_MS = 250, METER_W = 84, METER_H = 20;
  let meterTick = null;

  function fmtInt(n) { return n.toLocaleString("en-US").replace(/,/g, " "); }

  // Shared bucket math for every live trace (topbar meter + bench readout).
  function bucketRates(times, now, windowMs, bucketMs) {
    const buckets = Math.floor(windowMs / bucketMs);
    const rates = new Array(buckets).fill(0);
    for (const t of times) {
      const age = now - t;
      if (age > windowMs) continue;
      const i = buckets - 1 - Math.floor(age / bucketMs);
      if (i >= 0) rates[i] += 1000 / bucketMs;
    }
    return rates;
  }
  function polylinePoints(rates, w, h) {
    const max = Math.max(...rates, 20);
    const step = w / (rates.length - 1);
    return rates.map((r, i) => `${(i * step).toFixed(1)},${(h - 1 - (r / max) * (h - 2)).toFixed(1)}`).join(" ");
  }

  function drawMeter() {
    const now = performance.now();
    const rates = bucketRates(state.meterTimes, now, METER_WINDOW_MS, METER_BUCKET_MS);
    $("meter-trace").setAttribute("points", polylinePoints(rates, METER_W, METER_H));

    const lastSec = state.meterTimes.filter((t) => now - t < 1000).length;
    $("meter-rate").textContent = state.streaming ? `${lastSec} tok/s` : ($("meter-rate").dataset.final || "— tok/s");
    $("meter-odo").textContent = `Σ ${fmtInt(state.meterTotal)} tok`;
  }

  function meterStart() {
    state.meterTimes = [];
    delete $("meter-rate").dataset.final;

  function renderThread() {
    const chat = activeChat();
    if (!chat || chat.messages.length === 0) return renderHero();
    scroll.innerHTML = `<div class="thread" id="thread"></div>`;
    const t = $("thread");
    for (const m of chat.messages) t.appendChild(turnEl(m.role, m.content, m.stats, m.chunks));

  function turnEl(role, content, stats, chunks) {
    const turn = document.createElement("div");
    turn.className = "turn " + role;

      const b = document.createElement("div");
      b.className = "bubble";

  function setTelemetry(turn, s, text, chunks) {
    const el = turn.querySelector(".telemetry");
    el.classList.add("show");
    const ttft = s.ttft != null ? `${Math.round(s.ttft)} ms to first` : "…";
    const rate = s.rate != null ? `${s.rate.toFixed(1)} tok/s` : "…";
    el.innerHTML = `<span>${s.tokens} tok</span><span class="sep">·</span><span>${rate}</span><span class="sep">·</span><span>${ttft}</span>`;
    if (s.finishReason === "length") {
      el.insertAdjacentHTML("beforeend", `<span class="sep">·</span><span title="Raise max new tokens in sampling parameters to let it finish">stopped at the token cap</span>`);
    }
    if (chunks && chunks.length) {
      el.insertAdjacentHTML("beforeend", `<span class="sep">·</span>`);
      const btn = document.createElement("button");
      btn.className = "tok-toggle";
      btn.type = "button";
      btn.textContent = "tokens";
      btn.setAttribute("aria-pressed", "false");
      btn.title = "Show the exact token chunks the engine emitted";
      btn.addEventListener("click", () => {
        const prose = turn.querySelector(".prose");
        const on = btn.getAttribute("aria-pressed") !== "true";
        btn.setAttribute("aria-pressed", String(on));
        if (on) {
          const view = document.createElement("div");
          view.className = "tokview";
          for (const c of chunks) {
            const span = document.createElement("span");
            span.textContent = c;
            view.appendChild(span);

          prose.replaceChildren(view);

  function streamTelemetry(el, s) {
    el.classList.add("show");
    const ttft = s.ttft != null ? `${Math.round(s.ttft)} ms to first` : "…";
    const rate = s.rate != null ? `${s.rate.toFixed(1)} tok/s` : "…";
    el.innerHTML = `<span>${s.tokens} tok</span><span class="sep">·</span><span>${rate}</span><span class="sep">·</span><span>${ttft}</span>`;
  }

  // ---------- sending ----------
  function newChat() {
    if (state.bench.running) { toast("Stop the bench run first."); return; }
    if (state.streaming) stopStream();
    exitBenchView();
    state.activeId = null;
    renderActiveHistory();
    renderHero();
  }

  // Leaving the bench for a chat view (via sidebar) without a full toggle.
  function exitBenchView() {
    if (!state.benchView) return;
    state.benchView = false;
    $("bench-toggle").setAttribute("aria-pressed", "false");
  }

  function ensureChat(firstMsg) {
    let chat = activeChat();
    if (!chat) {
      chat = { id: "c" + Date.now().toString(36), title: firstMsg.slice(0, 48), messages: [] };
      state.chats.unshift(chat);
      state.activeId = chat.id;
    }
    return chat;
  }

  async function send() {
    if (state.streaming) return;
    if (state.bench.running) { toast("A bench run is in progress."); return; }
    const input = $("input");
    const text = input.value.trim();
    if (!text || !state.modelId) return;

    const onHero = !!$("hero-slot");
    const chat = ensureChat(text);
    chat.messages.push({ role: "user", content: text });
    input.value = ""; autogrow();

    if (onHero) renderThread();
    else { $("thread").appendChild(turnEl("user", text)); }

    renderActiveHistory();

    // assistant turn shell
    const aTurn = turnEl("assistant", "");
    const prose = aTurn.querySelector(".prose");
    const tel = aTurn.querySelector(".telemetry");
    aTurn.querySelector(".avatar").classList.add("live");
    prose.textContent = "";
    $("thread").appendChild(aTurn);
    scrollToBottom();

    setStreaming(true);
    meterStart();
    const result = await stream(chat, prose, tel);
    aTurn.querySelector(".avatar").classList.remove("live");
    setStreaming(false);
    meterStop(result.public.rate);

    chat.messages.push({ role: "assistant", content: result.text, stats: result.public, chunks: result.chunks });
    setTelemetry(aTurn, result.public, result.text, result.chunks);
    persist();
  }

  // The one SSE parse loop: read the response body, split on blank lines, hand each
  // decoded JSON event to onEvent. Shared by chat stream() and the bench runner.
  async function readSSE(res, onEvent) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const evt of events) {
        const line = evt.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let json; try { json = JSON.parse(data); } catch { continue; }
        onEvent(json);
      }
    }
  }

  async function stream(chat, prose, tel) {
    const messages = [];
    if (state.params.system.trim()) messages.push({ role: "system", content: state.params.system.trim() });
    for (const m of chat.messages) messages.push({ role: m.role, content: m.content });

    const controller = new AbortController();
    state.abort = controller;
    let acc = "", tokens = 0, start = performance.now(), firstAt = null, finishReason = null;
    const chunks = [];

    const paint = () => {
      prose.innerHTML = renderMarkdown(acc) + `<span class="tokcaret" aria-hidden="true"></span>`;
      if (firstAt != null && tokens > 0) {
        const secs = (performance.now() - firstAt) / 1000;
        const rate = secs > 0 ? tokens / secs : 0;
        streamTelemetry(tel, { tokens, rate, ttft: firstAt - start });
        setBrandLive(true);
      }
      scrollToBottom();
    };

    try {
      const res = await fetch("v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: state.modelId,
          messages,
          stream: true,
          temperature: state.params.temperature,
          top_p: state.params.topP,
          top_k: state.params.topK,
          frequency_penalty: state.params.frequencyPenalty,
          presence_penalty: state.params.presencePenalty,
          max_tokens: state.params.maxTokens,
        }),
        signal: controller.signal,
      });
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.detail || `server returned ${res.status}`);
      }

      await readSSE(res, (json) => {
        const reason = json.choices?.[0]?.finish_reason;
        if (reason) finishReason = reason;
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) {
          if (firstAt == null) firstAt = performance.now();
          acc += delta; tokens++;
          chunks.push(delta);
          state.meterTimes.push(performance.now());
          state.meterTotal++;
          paint();
        }
      });
    } catch (err) {
      if (err.name !== "AbortError") { acc += (acc ? "\n\n" : "") + `⚠ ${err.message}`; toast(err.message); }
    } finally {
      state.abort = null;
      setBrandLive(false);
    }

    prose.innerHTML = renderMarkdown(acc) || `<p style="color:var(--faint)">(no output)</p>`;
    const secs = firstAt != null ? (performance.now() - firstAt) / 1000 : 0;
    const rate = secs > 0 ? tokens / secs : 0;
    const pub = { tokens, rate: tokens ? rate : null, ttft: firstAt != null ? firstAt - start : null, finishReason };
    return { text: acc, public: pub, chunks };
  }

  function stopStream() { if (state.abort) state.abort.abort(); }

  function setStreaming(on) {
    state.streaming = on;
    const send = $("send"), icon = $("send-icon");
    if (!send) return;
    send.classList.toggle("stop", on);
    send.disabled = on ? false : !$("input").value.trim();
    icon.innerHTML = on
      ? `<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/>`
      : `<path d="M12 19V5M5 12l7-7 7 7"/>`;
    send.setAttribute("aria-label", on ? "Stop" : "Send");
    const quickQuestion = composerEl.querySelector("#quick-question");
    quickQuestion.disabled = on;
  }

  function setBrandLive(on) {
    const dot = $("brand-dot");
    if (dot) dot.classList.toggle("live", on);
  }

  // ---------- throughput bench ----------
  // One prompt per starter category so panes differ visibly; ×16 takes two per category.
  function benchPrompts() {
    const perCategory = state.bench.count / Object.keys(STARTER_TOPICS).length;
    return Object.values(STARTER_TOPICS).flatMap((qs) =>
      Array.from({ length: perCategory }, (_, j) => qs[(state.bench.offset + j) % qs.length])
    );
  }
  function benchUrl(path) {
    const base = state.bench.baseUrl.trim().replace(/\/+$/, "");
    return base ? `${base}/${path}` : path;
  }

  let benchEl = null;

  function paneMarkup(i) {
    const idx = String(i + 1).padStart(2, "0");
    return `<li class="pane" role="listitem" data-i="${i}">
      <div class="pane-head">
        <span class="pane-idx">${idx}</span>
        <span class="pane-dot" aria-hidden="true"></span>
        <span class="sr-only pane-status">idle</span>
        <svg class="pane-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg>
      </div>
      <div class="pane-q"></div>
      <div class="pane-body"></div>
      <div class="pane-foot">— · — · 0 tok</div>
    </li>`;
  }

  function benchRoot() {
    if (benchEl) return benchEl;
    const panes = Array.from({ length: state.bench.count }, (_, i) => paneMarkup(i)).join("");
    benchEl = document.createElement("div");
    benchEl.className = "bench";
    benchEl.innerHTML = `
      <div class="bench-head">
        <div class="bench-readout">
          <div>
            <span class="k">combined throughput</span>
            <div class="bench-tps"><span class="num" id="bench-tps">—</span><span class="unit">tok/s</span></div>
          </div>
          <svg class="bench-trace" viewBox="0 0 280 46" aria-hidden="true"><polyline class="trace" id="bench-trace" points="0,45 280,45" /></svg>
        </div>
        <div class="plate bench-plate" role="list" aria-label="Bench counters">
          <div class="plate-cell" role="listitem"><span class="k">active</span><span class="v" id="bench-active">0 / 8</span></div>
          <div class="plate-cell" role="listitem"><span class="k">Σ tokens</span><span class="v" id="bench-tokens">0</span></div>
          <div class="plate-cell" role="listitem"><span class="k">wall</span><span class="v" id="bench-wall">0.0 s</span></div>
          <div class="plate-cell" role="listitem"><span class="k">reqs/s done</span><span class="v" id="bench-reqs">0.00</span></div>
        </div>
      </div>
      <div class="bench-controls">
        <button class="bench-btn primary" id="bench-run-conc" type="button">Run ×8 concurrent</button>
        <button class="bench-btn secondary" id="bench-run-seq" type="button">Run ×8 sequential</button>
        <button class="bench-btn ghost" id="bench-stop" type="button" disabled>Stop</button>
        <div class="bench-count" role="group" aria-label="Stream count">
          <button type="button" id="bench-count-8" aria-pressed="true">×8</button>
          <button type="button" id="bench-count-16" aria-pressed="false">×16</button>
        </div>
        <input class="bench-base" id="bench-base" type="text" inputmode="url" spellcheck="false" autocomplete="off" placeholder="same origin" aria-label="Base URL for bench requests" />
        <button class="bench-reshuffle" id="bench-reshuffle" type="button">reshuffle</button>
      </div>
      <p class="bench-guide">Eight prompts, one engine, one continuously-batched decode loop.</p>
      <div class="bench-races" id="bench-races" aria-live="polite"></div>
      <ol class="bench-grid" id="bench-grid" role="list">${panes}</ol>`;
    wireBench();
    renderBenchPrompts();
    return benchEl;
  }

  function wireBench() {
    const base = benchEl.querySelector("#bench-base");
    base.value = state.bench.baseUrl;
    base.addEventListener("input", () => {
      state.bench.baseUrl = base.value;
      try { localStorage.setItem("llm-infer-bench-base", base.value); } catch {}
    });
    benchEl.querySelector("#bench-run-conc").addEventListener("click", () => runBench("concurrent"));
    benchEl.querySelector("#bench-run-seq").addEventListener("click", () => runBench("sequential"));
    benchEl.querySelector("#bench-stop").addEventListener("click", stopBench);
    benchEl.querySelector("#bench-reshuffle").addEventListener("click", () => {
      if (state.bench.running) return;
      state.bench.offset++;
      renderBenchPrompts();
    });
    benchEl.querySelector("#bench-count-8").addEventListener("click", () => setBenchCount(8));
    benchEl.querySelector("#bench-count-16").addEventListener("click", () => setBenchCount(16));
    syncBenchCount();
  }

  function setBenchCount(count) {
    if (state.bench.running || count === state.bench.count) return;
    state.bench.count = count;
    try { localStorage.setItem("llm-infer-bench-count", String(count)); } catch {}
    // Walls from different stream counts are not comparable, so a count switch retires the race.
    state.bench.results = { sequential: null, concurrent: null };
    renderRaces();
    syncBenchCount();
    resetBenchRun();
    renderBenchPrompts();
  }

  function syncBenchCount() {
    const count = state.bench.count;
    benchEl.querySelector("#bench-count-8").setAttribute("aria-pressed", String(count === 8));
    benchEl.querySelector("#bench-count-16").setAttribute("aria-pressed", String(count === 16));
    benchEl.querySelector("#bench-run-conc").textContent = `Run ×${count} concurrent`;
    benchEl.querySelector("#bench-run-seq").textContent = `Run ×${count} sequential`;
    benchEl.querySelector(".bench-guide").textContent =
      `${count === 8 ? "Eight" : "Sixteen"} prompts, one engine, one continuously-batched decode loop.`;
    benchEl.querySelector("#bench-active").textContent = `0 / ${count}`;
    // Query within benchEl: at wire time the bench root is not attached to the document yet.
    benchEl.querySelector("#bench-grid").innerHTML =
      Array.from({ length: count }, (_, i) => paneMarkup(i)).join("");
  }

  function paneEls() { return benchEl.querySelectorAll(".pane"); }

  function renderBenchPrompts() {
    if (!benchEl) return;
    const prompts = benchPrompts();
    paneEls().forEach((pane, i) => {
      const q = pane.querySelector(".pane-q");
      q.textContent = prompts[i];
      q.title = prompts[i];
    });
  }

  function setPaneStatus(pane, status) {
    pane.classList.remove("streaming", "done", "error", "stopped");
    if (status !== "idle") pane.classList.add(status);
    pane.querySelector(".pane-status").textContent = status;
  }

  function paneFoot(tokens, firstAt, start) {
    const ttft = firstAt != null ? `${Math.round(firstAt - start)} ms` : "—";
    const secs = firstAt != null ? (performance.now() - firstAt) / 1000 : 0;
    const rate = secs > 0 ? `${(tokens / secs).toFixed(1)} tok/s` : "—";
    return `${ttft} · ${rate} · ${tokens} tok`;
  }

  // Per-request token budget for bench runs: fixed so wall times and tok/s stay comparable
  // across runs and backends. The live race bar treats a request as fully done on EOS even
  // when it stopped short of the budget, so early finishes never stall the bar.
  const BENCH_MAX_TOKENS = 512;

  function resetBenchRun() {
    Object.assign(state.bench, { times: [], totalTokens: 0, reqsDone: 0, activeCount: 0, controllers: [], stopped: false, paneProgress: new Array(state.bench.count).fill(0) });
    paneEls().forEach((pane) => {
      setPaneStatus(pane, "idle");
      const body = pane.querySelector(".pane-body");
      body.textContent = ""; body.classList.remove("err");
      pane.querySelector(".pane-foot").textContent = "— · — · 0 tok";
    });
    $("bench-tps").textContent = "—";
    $("bench-tokens").textContent = "0";
    $("bench-active").textContent = `0 / ${state.bench.count}`;
    $("bench-wall").textContent = "0.0 s";
    $("bench-reqs").textContent = "0.00";
  }

  function setBenchRunning(on) {
    benchEl.querySelector("#bench-run-conc").disabled = on;
    benchEl.querySelector("#bench-run-seq").disabled = on;
    benchEl.querySelector("#bench-reshuffle").disabled = on;
    benchEl.querySelector("#bench-base").disabled = on;
    benchEl.querySelector("#bench-stop").disabled = !on;
  }

  let benchTick = null;
  function benchMeterStart() { benchEl.classList.add("live"); benchTick = setInterval(drawBench, 200); drawBench(); }
  function benchMeterStop() { clearInterval(benchTick); benchTick = null; benchEl.classList.remove("live"); }

  function drawBench() {
    const now = performance.now();
    const rates = bucketRates(state.bench.times, now, METER_WINDOW_MS, METER_BUCKET_MS);
    $("bench-trace").setAttribute("points", polylinePoints(rates, 280, 46));
    $("bench-tokens").textContent = fmtInt(state.bench.totalTokens);
    $("bench-active").textContent = `${state.bench.activeCount} / ${state.bench.count}`;
    if (state.bench.running) {
      const lastSec = state.bench.times.filter((t) => now - t < 1000).length;
      $("bench-tps").textContent = String(lastSec);
      const elapsed = (now - state.bench.runStart) / 1000;
      $("bench-wall").textContent = `${elapsed.toFixed(1)} s`;
      $("bench-reqs").textContent = elapsed > 0 ? (state.bench.reqsDone / elapsed).toFixed(2) : "0.00";
      const liveFill = $("race-live-fill");
      if (liveFill) {
        const done = state.bench.paneProgress.reduce((sum, p) => sum + p, 0) / state.bench.paneProgress.length;
        liveFill.style.width = `${(done * 100).toFixed(1)}%`;
        $("race-live-time").textContent = `${elapsed.toFixed(1)} s`;
      }
    }
    drawMeter();  // the session odometer keeps counting bench tokens
  }

  function renderLiveRace(mode) {
    // While a run is in flight the row is a *progress* bar — completion fraction across the
    // eight requests — with a live clock. finishBench() re-renders the comparative wall-time
    // bars over it, so the two semantics never show at once for the same mode.
    const wrap = $("bench-races");
    const other = mode === "concurrent" ? "sequential" : "concurrent";
    const otherWall = state.bench.results[other];
    let html = "";
    if (otherWall != null) {
      html += `<div class="race-row">
        <span class="race-label">${other}</span>
        <span class="race-track"><span class="race-fill ${other}" style="width:100%"></span></span>
        <span class="race-time">${otherWall.toFixed(1)} s</span>
      </div>`;
    }
    html += `<div class="race-row">
      <span class="race-label">${mode}</span>
      <span class="race-track"><span class="race-fill live ${mode}" id="race-live-fill" style="width:0"></span></span>
      <span class="race-time" id="race-live-time">0.0 s</span>
    </div>`;
    wrap.innerHTML = html;
  }

  async function runBench(mode) {
    if (state.bench.running || state.streaming) return;
    resetBenchRun();
    const prompts = benchPrompts();

    let modelId;
    try {
      const r = await fetch(benchUrl("v1/models"));
      if (!r.ok) throw new Error(`models returned ${r.status}`);
      const j = await r.json();
      modelId = j?.data?.[0]?.id;
      if (!modelId) throw new Error("no model advertised");
    } catch (err) {
      toast(`Bench endpoint unreachable: ${err.message}`);
      paneEls().forEach((pane) => { setPaneStatus(pane, "error"); showPaneError(pane, err.message); });
      return;
    }

    state.bench.running = true;
    state.bench.mode = mode;
    setBenchRunning(true);
    benchMeterStart();
    state.bench.runStart = performance.now();
    renderLiveRace(mode);

    if (mode === "concurrent") {
      await Promise.all(prompts.map((p, i) => runPane(i, p, modelId)));
    } else {
      for (let i = 0; i < prompts.length; i++) {
        if (state.bench.stopped) break;
        await runPane(i, prompts[i], modelId);
      }
    }

    const wall = (performance.now() - state.bench.runStart) / 1000;
    finishBench(mode, wall);
  }

  async function runPane(i, prompt, modelId) {
    const pane = paneEls()[i];
    const body = pane.querySelector(".pane-body");
    const foot = pane.querySelector(".pane-foot");
    const controller = new AbortController();
    state.bench.controllers.push(controller);
    setPaneStatus(pane, "streaming");
    state.bench.activeCount++;
    let acc = "", tokens = 0, start = performance.now(), firstAt = null;
    try {
      const res = await fetch(benchUrl("v1/chat/completions"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: modelId, messages: [{ role: "user", content: prompt }], stream: true, temperature: 0, max_tokens: BENCH_MAX_TOKENS }),
        signal: controller.signal,
      });
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.detail || `server returned ${res.status}`);
      }
      await readSSE(res, (json) => {
        const delta = json.choices?.[0]?.delta?.content;
        if (delta) {
          if (firstAt == null) firstAt = performance.now();
          acc += delta; tokens++;
          state.bench.times.push(performance.now());
          state.bench.totalTokens++;
          state.meterTotal++;
          state.bench.paneProgress[i] = Math.min(tokens / BENCH_MAX_TOKENS, 1);
          body.textContent = acc;
          body.scrollTop = body.scrollHeight;  // auto-follow the tail
          foot.textContent = paneFoot(tokens, firstAt, start);
        }
      });
      state.bench.activeCount--;
      if (!state.bench.stopped) state.bench.paneProgress[i] = 1;  // EOS before the budget still completes the request
      setPaneStatus(pane, state.bench.stopped ? "stopped" : "done");
    } catch (err) {
      state.bench.activeCount--;
      if (err.name === "AbortError") { setPaneStatus(pane, "stopped"); }
      else { setPaneStatus(pane, "error"); showPaneError(pane, err.message); toast(err.message); }
    } finally {
      state.bench.reqsDone++;
    }
  }

  function showPaneError(pane, msg) {
    const body = pane.querySelector(".pane-body");
    body.classList.add("err");
    body.textContent = `⚠ ${msg}`;
  }

  function stopBench() {
    if (!state.bench.running) return;
    state.bench.stopped = true;
    for (const c of state.bench.controllers) { try { c.abort(); } catch {} }
  }

  function finishBench(mode, wall) {
    state.bench.running = false;
    setBenchRunning(false);
    benchMeterStop();
    const finalRate = wall > 0 ? state.bench.totalTokens / wall : 0;
    drawBench();  // flush counters; running is false so it won't clobber the finals below
    $("bench-tps").textContent = state.bench.totalTokens ? finalRate.toFixed(1) : "—";
    $("bench-wall").textContent = `${wall.toFixed(1)} s`;
    $("bench-active").textContent = `0 / ${state.bench.count}`;
    // An aborted run keeps its partial panes but earns no race bar; re-rendering from
    // results either way clears the in-flight progress row.
    if (!state.bench.stopped) state.bench.results[mode] = wall;
    renderRaces();
    state.bench.stopped = false;
  }

  function renderRaces() {
    const wrap = $("bench-races");
    const { sequential, concurrent } = state.bench.results;
    const slower = Math.max(sequential || 0, concurrent || 0) || 1;
    const bar = (label, wall) => {
      if (wall == null) return "";
      const pct = Math.max(2, (wall / slower) * 100).toFixed(1);
      return `<div class="race-row">
        <span class="race-label">${label}</span>
        <span class="race-track"><span class="race-fill ${label}" data-w="${pct}%" style="width:0"></span></span>
        <span class="race-time">${wall.toFixed(1)} s</span>
      </div>`;
    };
    let html = bar("sequential", sequential) + bar("concurrent", concurrent);
    if (sequential != null && concurrent != null && concurrent > 0) {
      html += `<div class="race-punch">concurrent ×${(sequential / concurrent).toFixed(1)} faster</div>`;
    }
    // Seed each rebuilt bar at the width its predecessor was showing, so the just-finished
    // live progress bar glides to its final width instead of flashing back to zero.
    const prevWidths = {};
    wrap.querySelectorAll(".race-fill").forEach((f) => {
      prevWidths[f.classList.contains("sequential") ? "sequential" : "concurrent"] = f.style.width;
    });
    wrap.innerHTML = html;
    // Set the true final widths after a forced reflow: the transition animates them, and with
    // prefers-reduced-motion (transitions globally off) they simply snap to correct. A reflow
    // rather than requestAnimationFrame because rAF never fires in a backgrounded tab, which
    // would leave the bars stuck at zero width.
    wrap.querySelectorAll(".race-fill").forEach((f) => {
      const mode = f.classList.contains("sequential") ? "sequential" : "concurrent";
      f.style.width = prevWidths[mode] || "0";
      void f.offsetWidth;
      f.style.width = f.dataset.w;
    });
  }

  function toggleBench() {
    if (state.streaming) { toast("Finish the chat response first."); return; }
    if (state.bench.running) { toast("Stop the bench run first."); return; }
    setBenchView(!state.benchView);
  }

  function setBenchView(on) {
    state.benchView = on;
    $("bench-toggle").setAttribute("aria-pressed", String(on));
    if (on) {
      scroll.replaceChildren(benchRoot());
      dock.hidden = true;
    } else {
      // Rebuild chat from state — it survived untouched while bench was showing.
      const chat = activeChat();
      if (chat && chat.messages.length) renderThread(); else renderHero();
    }
  }

  // ---------- sidebar / history ----------
  function renderActiveHistory() {
    const h = $("history");
    h.replaceChildren();
    if (!state.chats.length) return;

    const toggle = document.createElement("button");
    toggle.className = "history-toggle";
    toggle.type = "button";
    toggle.setAttribute("aria-controls", "recent-chats");
    toggle.setAttribute("aria-expanded", String(state.historyExpanded));
    toggle.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span>Recent</span>`;
    toggle.addEventListener("click", () => {
      state.historyExpanded = !state.historyExpanded;
      renderActiveHistory();
    });
    h.appendChild(toggle);

    const list = document.createElement("div");
    list.className = "history-list";
    list.id = "recent-chats";
    list.hidden = !state.historyExpanded;
    for (const c of state.chats) {
      const b = document.createElement("button");
      b.className = "chat-item" + (c.id === state.activeId ? " active" : "");
      b.textContent = c.title || "Untitled";
      b.addEventListener("click", () => {
        if (state.bench.running) { toast("Stop the bench run first."); return; }
        exitBenchView();
        state.activeId = c.id; renderThread(); renderActiveHistory();
      });
      list.appendChild(b);
    }
    h.appendChild(list);
  }

  // ---------- composer wiring ----------
  function wireComposer() {
    const input = composerEl.querySelector("#input");
    const send = composerEl.querySelector("#send");
    const composer = composerEl;

    input.addEventListener("input", () => { autogrow(); if (!state.streaming) send.disabled = !input.value.trim(); });
    input.addEventListener("focus", () => composer.classList.add("focused"));
    input.addEventListener("blur", () => composer.classList.remove("focused"));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); state.streaming ? stopStream() : window.__send(); }
    });
    send.addEventListener("click", () => state.streaming ? stopStream() : window.__send());

    const quickQuestion = composerEl.querySelector("#quick-question");
    for (const [topic, questions] of Object.entries(STARTER_TOPICS)) {
      const group = document.createElement("optgroup");
      group.label = topic;
      for (const question of questions) {
        const option = document.createElement("option");
        option.value = question;
        option.textContent = question;
        group.appendChild(option);
      }
      quickQuestion.appendChild(group);
    }
    quickQuestion.addEventListener("change", () => {
      if (quickQuestion.value) useStarterQuestion(quickQuestion.value);
      quickQuestion.value = "";
    });

    // params popover
    const pop = composerEl.querySelector("#popover");
    const back = composerEl.querySelector("#pop-backdrop");
    const openPop = (o) => { pop.classList.toggle("open", o); back.classList.toggle("open", o); };
    composerEl.querySelector("#params-btn").addEventListener("click", () => openPop(!pop.classList.contains("open")));
    composerEl.querySelector("#pop-close").addEventListener("click", () => openPop(false));
    back.addEventListener("click", () => openPop(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") openPop(false); });

    const temp = composerEl.querySelector("#temp"), topP = composerEl.querySelector("#top-p"), topK = composerEl.querySelector("#top-k"), freq = composerEl.querySelector("#freq"), presence = composerEl.querySelector("#presence"), maxtok = composerEl.querySelector("#maxtok"), sys = composerEl.querySelector("#system");
    temp.value = state.params.temperature; topP.value = state.params.topP; topK.value = state.params.topK; freq.value = state.params.frequencyPenalty; presence.value = state.params.presencePenalty; maxtok.value = state.params.maxTokens; sys.value = state.params.system;
    composerEl.querySelector("#temp-val").textContent = (+temp.value).toFixed(2);
    composerEl.querySelector("#top-p-val").textContent = (+topP.value).toFixed(2);
    composerEl.querySelector("#top-k-val").textContent = topK.value;
    composerEl.querySelector("#freq-val").textContent = (+freq.value).toFixed(2);
    composerEl.querySelector("#presence-val").textContent = (+presence.value).toFixed(2);
    composerEl.querySelector("#max-val").textContent = maxtok.value;
    temp.addEventListener("input", () => { state.params.temperature = +temp.value; composerEl.querySelector("#temp-val").textContent = (+temp.value).toFixed(2); syncParamsLabel(); });
    topP.addEventListener("input", () => { state.params.topP = +topP.value; composerEl.querySelector("#top-p-val").textContent = (+topP.value).toFixed(2); syncParamsLabel(); });
    topK.addEventListener("input", () => { state.params.topK = +topK.value; composerEl.querySelector("#top-k-val").textContent = topK.value; syncParamsLabel(); });
    freq.addEventListener("input", () => { state.params.frequencyPenalty = +freq.value; composerEl.querySelector("#freq-val").textContent = (+freq.value).toFixed(2); });
    presence.addEventListener("input", () => { state.params.presencePenalty = +presence.value; composerEl.querySelector("#presence-val").textContent = (+presence.value).toFixed(2); });
    maxtok.addEventListener("input", () => { state.params.maxTokens = +maxtok.value; composerEl.querySelector("#max-val").textContent = maxtok.value; });
    sys.addEventListener("input", () => { state.params.system = sys.value; });
  }
  window.__send = send;

  function syncParamsLabel() {
    const l = composerEl?.querySelector("#params-label");
    if (l) l.textContent = `temp ${state.params.temperature.toFixed(2)} · p ${state.params.topP.toFixed(2)} · k ${state.params.topK}`;
  }
  function autogrow() { const i = $("input"); if (!i) return; i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 240) + "px"; }
  function focusInput() { const i = $("input"); if (i) setTimeout(() => i.focus(), 30); }
  function scrollToBottom() { scroll.scrollTop = scroll.scrollHeight; }

  // ---------- misc ----------
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200); }

  $("new-chat").addEventListener("click", newChat);
  function setRailOpen(open) {
    if (window.innerWidth <= 820) app.classList.toggle("rail-open", open);
    else app.classList.toggle("rail-collapsed", !open);
  }
  $("rail-toggle").addEventListener("click", () => setRailOpen(false));
  $("rail-scrim").addEventListener("click", () => setRailOpen(false));
  $("rail-open").addEventListener("click", () => {
    const open = window.innerWidth <= 820 ? !app.classList.contains("rail-open") : true;
    setRailOpen(open);
  });
  $("model-foot").addEventListener("click", () => { const p = composerEl?.querySelector("#params-btn"); p?.click(); });
  $("bench-toggle").addEventListener("click", toggleBench);

  // ---------- boot ----------
  $("model-glyph").innerHTML = ESME_MARK;
  app.classList.remove("rail-collapsed"); // open by default on desktop
  if (window.innerWidth <= 820) app.classList.add("rail-collapsed");
  renderActiveHistory();
  renderHero();
  drawMeter();
  discoverModel();
})();
</script>
</body>
</html>
