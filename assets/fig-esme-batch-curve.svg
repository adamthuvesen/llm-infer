lat naive-HF floor.</text></g></g></g><g class="annotation" data-index="3" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,393.38,338.08000000000004)"><g class="cursor-pointer" transform="translate(332,328)"><rect class="bg" x="0.5" y="0.5" width="122" height="19" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="61.453125" y="15" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: rgb(99, 110, 250); fill-opacity: 1; white-space: pre;">llm_infer (this repo)</text></g></g></g><g class="annotation" data-index="4" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,714.62,441.32)"><g class="cursor-pointer" transform="translate(541,431)"><rect class="bg" x="0.5" y="0.5" width="347" height="19" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="173.8359375" y="15" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: rgb(239, 85, 59); fill-opacity: 1; white-space: pre;">naive HF sequential (floor) - 43-48 tok/s across all levels</text></g></g></g><g class="annotation" data-index="5" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,737.61,181.02)"><g class="cursor-pointer" transform="translate(692,171)"><rect class="bg" x="0.5" y="0.5" width="90" height="20" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="45.671875" y="16" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: rgb(31, 41, 55); fill-opacity: 1; white-space: pre;"><tspan style="font-weight:bold">57x the floor</tspan></text></g></g></g></g></svg>